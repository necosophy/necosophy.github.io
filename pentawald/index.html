<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pentawald — field recorder</title>
<meta name="description" content="Offline MIDI field recorder for biofeedback devices.">
<meta name="theme-color" content="#0a0a08">
<style>
  :root {
    --bg: #0a0a08;
    --panel: #14140f;
    --ink: #ece7d6;
    --muted: #8a8677;
    --hairline: #2a2a20;
    --accent: #b8874a;
    --live: #7a9463;
    --rec: #c1503f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body {
    color: var(--ink);
    font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    padding: 1.25rem 1.25rem 0.5rem;
  }

  .wordmark {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .tagline {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0.75rem 1.25rem 1.5rem;
    gap: 1rem;
    min-height: 0;
  }

  #device-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1rem 1.1rem;
    font-size: 0.95rem;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  #device-status:active {
    border-color: var(--accent);
  }

  #device-status .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  #device-status.connected .dot {
    background: var(--live);
  }

  #device-status .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #device-status .rescan {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  #device-picker {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
  }

  #device-picker.visible {
    display: flex;
  }

  #device-picker button {
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.85rem 1rem;
    text-align: left;
  }

  #device-picker button:active {
    border-color: var(--accent);
  }

  #note-feed {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }

  .feed-empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 1rem 0.25rem;
  }

  .feed-row {
    display: grid;
    grid-template-columns: 3.5rem 1fr 4rem;
    gap: 0.5rem;
    align-items: baseline;
    padding: 0.55rem 0.75rem;
    background: var(--panel);
    border-left: 2px solid var(--hairline);
    border-radius: 2px;
    font-size: 0.9rem;
  }

  .feed-row.note-on {
    border-left-color: var(--live);
  }

  .feed-row.cc {
    border-left-color: var(--accent);
  }

  .feed-row.marker {
    border-left-color: var(--accent);
  }

  .feed-row.marker .note {
    color: var(--accent);
  }

  .feed-row .ch {
    color: var(--muted);
    font-size: 0.75rem;
  }

  .feed-row .vel {
    text-align: right;
    color: var(--muted);
    font-size: 0.8rem;
  }

  #transport {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    padding-top: 0.25rem;
  }

  #rec-readout {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  #rec-readout .time {
    color: var(--ink);
    font-size: 1rem;
  }

  #record-btn {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 1.15rem 1rem;
  }

  #record-btn:active {
    border-color: var(--rec);
  }

  #record-btn.recording {
    background: var(--rec);
    border-color: var(--rec);
    color: #170a08;
    animation: rec-pulse 1.4s ease-in-out infinite;
  }

  @keyframes rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.78; }
  }

  #marker-row {
    flex-shrink: 0;
    display: none;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  #marker-row.visible {
    display: flex;
  }

  .marker-btn {
    flex: 1 1 auto;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.7rem 1rem;
  }

  .marker-btn:active {
    border-color: var(--accent);
  }

  #marker-custom-panel {
    flex-shrink: 0;
    display: none;
    gap: 0.5rem;
  }

  #marker-custom-panel.visible {
    display: flex;
  }

  #marker-custom-input {
    flex: 1;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.7rem 0.9rem;
  }

  #marker-custom-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #marker-custom-confirm {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: #170a08;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.7rem 1.1rem;
  }

  #synth-panel {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--hairline);
  }

  #synth-preset-row {
    display: flex;
    gap: 0.5rem;
  }

  #synth-controls-row {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  #synth-controls-row[hidden] {
    display: none;
  }

  .synth-preset-btn {
    flex: 1 1 auto;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.65rem 1rem;
  }

  .synth-preset-btn:active {
    border-color: var(--accent);
  }

  .synth-preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .synth-control {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .synth-control label {
    width: 4rem;
    flex-shrink: 0;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .synth-control input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }

  #synth-waveform {
    flex: 1;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.5rem 0.6rem;
  }

  #synth-mute-btn {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.85rem 1rem;
  }

  #synth-mute-btn.muted {
    background: var(--rec);
    border-color: var(--rec);
    color: #170a08;
  }

  #export-panel {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--hairline);
    margin-top: 0.25rem;
  }

  #export-panel[hidden] {
    display: none;
  }

  #export-panel label {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #filename-input {
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.85rem 1rem;
  }

  #filename-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .export-actions {
    display: flex;
    gap: 0.6rem;
  }

  #export-btn {
    flex: 1;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #170a08;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.9rem 1rem;
  }

  #discard-btn {
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 0.9rem 1rem;
  }

  #export-status {
    min-height: 1.2em;
    font-size: 0.8rem;
    color: var(--live);
  }

  #export-status.error {
    color: var(--rec);
  }

  #buffer-info {
    font-size: 0.75rem;
    color: var(--muted);
  }

</style>
</head>
<body>

<header>
  <div class="wordmark">Pentawald</div>
  <div class="tagline">field recorder</div>
</header>

<main>
  <div id="device-status" class="disconnected">
    <span class="dot"></span>
    <span class="label" id="device-label">Requesting MIDI access&hellip;</span>
    <span class="rescan">tap to rescan</span>
  </div>

  <div id="device-picker"></div>

  <div id="note-feed">
    <div class="feed-empty">Waiting for notes&hellip;</div>
  </div>

  <div id="transport">
    <div id="rec-readout"><span class="time">00:00</span> &middot; 0 notes</div>
    <button id="record-btn">&#9679; Record</button>
  </div>

  <div id="marker-row"></div>

  <div id="marker-custom-panel">
    <input id="marker-custom-input" type="text" placeholder="Label" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="marker-custom-confirm">Add</button>
  </div>

  <div id="synth-panel">
    <div id="synth-preset-row"></div>
    <div id="synth-controls-row" hidden>
      <div class="synth-control">
        <label for="synth-attack">Attack</label>
        <input id="synth-attack" type="range" min="0.001" max="1" step="0.001">
      </div>
      <div class="synth-control">
        <label for="synth-release">Release</label>
        <input id="synth-release" type="range" min="0.05" max="3" step="0.01">
      </div>
      <div class="synth-control">
        <label for="synth-cutoff">Cutoff</label>
        <input id="synth-cutoff" type="range" min="200" max="8000" step="10">
      </div>
      <div class="synth-control">
        <label for="synth-waveform">Wave</label>
        <select id="synth-waveform">
          <option value="sine">sine</option>
          <option value="triangle">triangle</option>
          <option value="sawtooth">sawtooth</option>
          <option value="square">square</option>
        </select>
      </div>
    </div>
    <button id="synth-mute-btn" type="button">Mute</button>
  </div>

  <div id="export-panel" hidden>
    <div id="buffer-info"></div>
    <div>
      <label for="filename-input">Filename</label>
      <input id="filename-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="export-actions">
      <button id="export-btn">Export .mid</button>
      <button id="discard-btn">Discard</button>
    </div>
    <div id="export-status" aria-live="polite"></div>
  </div>
</main>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('device-status');
  var labelEl = document.getElementById('device-label');
  var pickerEl = document.getElementById('device-picker');
  var feedEl = document.getElementById('note-feed');

  var recordBtn = document.getElementById('record-btn');
  var recReadout = document.getElementById('rec-readout');
  var markerRowEl = document.getElementById('marker-row');
  var markerCustomPanel = document.getElementById('marker-custom-panel');
  var markerCustomInput = document.getElementById('marker-custom-input');
  var markerCustomConfirm = document.getElementById('marker-custom-confirm');
  var synthPresetRow = document.getElementById('synth-preset-row');
  var synthAttackInput = document.getElementById('synth-attack');
  var synthReleaseInput = document.getElementById('synth-release');
  var synthCutoffInput = document.getElementById('synth-cutoff');
  var synthWaveformSelect = document.getElementById('synth-waveform');
  var synthMuteBtn = document.getElementById('synth-mute-btn');
  var exportPanel = document.getElementById('export-panel');
  var filenameInput = document.getElementById('filename-input');
  var exportBtn = document.getElementById('export-btn');
  var discardBtn = document.getElementById('discard-btn');
  var exportStatusEl = document.getElementById('export-status');
  var bufferInfoEl = document.getElementById('buffer-info');

  var midiAccess = null;
  var selectedInput = null;
  var lastMIDIMessageAt = 0;
  var feedEntries = [];
  var FEED_LIMIT = 20;

  // 960 ticks/quarter note is what most DAWs expect from an imported file.
  // At the fixed 120 BPM tempo (500,000 microseconds/quarter) that gives
  // ~0.52 ms per tick — sub-millisecond resolution, so recorded timestamps
  // still round-trip with no perceptible quantization.
  var PPQ = 960;
  var TEMPO_US_PER_QUARTER = 500000; // 120 BPM
  var TICKS_PER_MS = PPQ / (TEMPO_US_PER_QUARTER / 1000);

  var recording = false;
  var recordStartPerf = 0;
  var recordStartDate = null;
  var recordedDurationMs = 0;
  var recordedEvents = [];
  var noteOnCount = 0;
  var wakeLock = null;
  var timerHandle = null;

  // Trivial to edit: this list drives the one-tap marker buttons.
  var MARKER_PRESETS = ['watered', 'touched', 'moved'];
  var recordedMarkers = [];
  var pendingCustomMarker = null;

  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  function noteName(n) {
    return NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
  }

  // --- Monitoring synth. Purely a live audio side-effect of incoming
  // note-on/off — it never touches recordedEvents, so muting or tweaking
  // it can't affect what gets recorded or exported. ---

  // "noise" is still an oscillator like pad/bell (a sawtooth, per its
  // waveform below) — what makes it "noise"/percussive is voiceType:
  // it decays on its own shortly after the hit (see synthNoteOn) instead
  // of sustaining for as long as the note is held.
  // Listed last (pad/bell first) and defaults to a low cutoff — 10% up
  // the 200-8000 slider range — so it doesn't hit the highs hard.
  var SYNTH_PRESETS = {
    pad: { attack: 0.4, release: 1.2, cutoff: 1200, waveform: 'triangle', voiceType: 'tonal' },
    bell: { attack: 0.031, release: 0.2, cutoff: 980, waveform: 'sine', voiceType: 'tonal' },
    noise: { attack: 0.001, release: 0.15, cutoff: 980, waveform: 'sawtooth', voiceType: 'noise' }
  };
  var DEFAULT_PRESET_NAME = Object.keys(SYNTH_PRESETS)[0];

  var audioCtx = null;
  var masterGain = null;
  var sharedFilter = null;
  var voices = {};
  var voiceOrder = [];
  var VOICE_LIMIT = 12;
  var synthMuted = false;
  var currentAttack = SYNTH_PRESETS[DEFAULT_PRESET_NAME].attack;
  var currentRelease = SYNTH_PRESETS[DEFAULT_PRESET_NAME].release;
  var currentCutoff = SYNTH_PRESETS[DEFAULT_PRESET_NAME].cutoff;
  var currentWaveform = SYNTH_PRESETS[DEFAULT_PRESET_NAME].waveform;
  var currentVoiceType = SYNTH_PRESETS[DEFAULT_PRESET_NAME].voiceType;

  function initAudio() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = synthMuted ? 0 : 0.8;

    // One filter shared by every voice, rather than one per voice — far
    // cheaper under heavy simultaneous note traffic, which is where the
    // crackling came from.
    sharedFilter = audioCtx.createBiquadFilter();
    sharedFilter.type = 'lowpass';
    sharedFilter.frequency.value = currentCutoff;

    masterGain.connect(sharedFilter);
    sharedFilter.connect(audioCtx.destination);
  }

  // iOS requires a user gesture before audio can start; harmless on
  // Android, so this runs unconditionally on the first tap anywhere.
  document.addEventListener('pointerdown', function firstTap() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true, passive: true });

  function noteFrequency(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
  }

  function removeFromVoiceOrder(key) {
    var idx = voiceOrder.indexOf(key);
    if (idx !== -1) voiceOrder.splice(idx, 1);
  }

  // Disconnects a finished voice's nodes and clears its bookkeeping — but
  // only if that bookkeeping still points at THIS source. A same-key
  // retrigger overwrites voices[key] with a new voice before the old
  // one's onended fires, so without this guard the old voice's belated
  // cleanup could wipe out the new one.
  function makeVoiceCleanup(key, source, gainNode) {
    return function () {
      try { source.disconnect(); } catch (err) {}
      try { gainNode.disconnect(); } catch (err) {}
      if (voices[key] && voices[key].source === source) {
        delete voices[key];
        removeFromVoiceOrder(key);
      }
    };
  }

  function synthNoteOn(channel, note, velocity) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    var key = channel + '_' + note;
    stopVoiceImmediately(key);

    // A burst of rapid, differently-pitched notes (rather than one pitch
    // retriggering) wouldn't get capped above — this is the backstop
    // against unbounded polyphony piling up under heavy note traffic.
    if (voiceOrder.length >= VOICE_LIMIT) {
      stopVoiceImmediately(voiceOrder[0]);
    }

    var percussive = currentVoiceType === 'noise';

    var source = audioCtx.createOscillator();
    source.type = currentWaveform;
    source.frequency.value = noteFrequency(note);

    var gainNode = audioCtx.createGain();
    var peak = Math.min(0.28, 0.05 + (velocity / 127) * 0.23);
    var now = audioCtx.currentTime;
    var attackTime = Math.max(0.001, currentAttack);
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(peak, now + attackTime);

    source.connect(gainNode);
    gainNode.connect(masterGain);
    source.start(now);

    if (percussive) {
      // Decays on its own shortly after the hit, like a real pluck or
      // drum — regardless of how long the source note stays "on".
      // Without this it just sustains at full volume for as long as the
      // note is held, which for continuously-firing biofeedback input
      // reads as one long tone no matter what release is set to.
      var decayTime = Math.max(0.05, currentRelease);
      gainNode.gain.linearRampToValueAtTime(0.0001, now + attackTime + decayTime);
      source.stop(now + attackTime + decayTime + 0.05);
    }

    source.onended = makeVoiceCleanup(key, source, gainNode);
    voices[key] = { source: source, gain: gainNode, percussive: percussive };
    voiceOrder.push(key);
  }

  function stopVoiceImmediately(key) {
    var v = voices[key];
    if (!v) return;
    var now = audioCtx.currentTime;
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(0.0001, now);
    try { v.source.stop(now + 0.01); } catch (err) {}
    delete voices[key];
    removeFromVoiceOrder(key);
  }

  function stopAllVoicesImmediately() {
    Object.keys(voices).forEach(function (key) {
      stopVoiceImmediately(key);
    });
  }

  function synthNoteOff(channel, note) {
    if (!audioCtx) return;
    var key = channel + '_' + note;
    var v = voices[key];
    // A percussive voice already has its own decay scheduled from the
    // moment it started — note-off doesn't touch it.
    if (!v || v.percussive) return;
    var now = audioCtx.currentTime;
    var releaseTime = Math.max(0.02, currentRelease);
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(0.0001, now + releaseTime);
    v.source.stop(now + releaseTime + 0.05);
    delete voices[key];
    removeFromVoiceOrder(key);
  }

  function applyLiveControlsToVoices() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    sharedFilter.frequency.setTargetAtTime(currentCutoff, now, 0.01);
    Object.keys(voices).forEach(function (key) {
      voices[key].source.type = currentWaveform;
    });
  }

  function clearActivePresetHighlight() {
    Array.prototype.forEach.call(synthPresetRow.children, function (btn) {
      btn.classList.remove('active');
    });
  }

  Object.keys(SYNTH_PRESETS).forEach(function (name) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'synth-preset-btn';
    btn.textContent = name;
    btn.addEventListener('click', function () {
      var preset = SYNTH_PRESETS[name];
      currentAttack = preset.attack;
      currentRelease = preset.release;
      currentCutoff = preset.cutoff;
      currentWaveform = preset.waveform;
      currentVoiceType = preset.voiceType;
      synthAttackInput.value = currentAttack;
      synthReleaseInput.value = currentRelease;
      synthCutoffInput.value = currentCutoff;
      synthWaveformSelect.value = currentWaveform;
      applyLiveControlsToVoices();
      clearActivePresetHighlight();
      btn.classList.add('active');
    });
    synthPresetRow.appendChild(btn);
  });

  synthAttackInput.value = currentAttack;
  synthReleaseInput.value = currentRelease;
  synthCutoffInput.value = currentCutoff;
  synthWaveformSelect.value = currentWaveform;
  synthPresetRow.children[0].classList.add('active');

  synthAttackInput.addEventListener('input', function () {
    currentAttack = parseFloat(synthAttackInput.value);
    clearActivePresetHighlight();
  });
  synthReleaseInput.addEventListener('input', function () {
    currentRelease = parseFloat(synthReleaseInput.value);
    clearActivePresetHighlight();
  });
  synthCutoffInput.addEventListener('input', function () {
    currentCutoff = parseFloat(synthCutoffInput.value);
    applyLiveControlsToVoices();
    clearActivePresetHighlight();
  });
  synthWaveformSelect.addEventListener('change', function () {
    currentWaveform = synthWaveformSelect.value;
    applyLiveControlsToVoices();
    clearActivePresetHighlight();
  });

  synthMuteBtn.addEventListener('click', function () {
    synthMuted = !synthMuted;
    synthMuteBtn.classList.toggle('muted', synthMuted);
    synthMuteBtn.textContent = synthMuted ? 'Unmute' : 'Mute';
    if (masterGain) {
      masterGain.gain.setTargetAtTime(synthMuted ? 0 : 0.8, audioCtx.currentTime, 0.01);
    }
  });

  function setStatus(text, connected) {
    labelEl.textContent = text;
    statusEl.classList.toggle('connected', !!connected);
  }

  function renderPicker(inputs) {
    pickerEl.innerHTML = '';
    if (inputs.length < 2) {
      pickerEl.classList.remove('visible');
      return;
    }
    inputs.forEach(function (input) {
      var btn = document.createElement('button');
      btn.textContent = input.name || 'Unnamed MIDI device';
      btn.addEventListener('click', function () {
        selectInput(input);
      });
      pickerEl.appendChild(btn);
    });
    pickerEl.classList.add('visible');
  }

  function detachInput() {
    if (selectedInput) {
      selectedInput.onmidimessage = null;
      selectedInput = null;
    }
    // A note left sounding when the cable drops has no note-off coming —
    // silence the synth immediately rather than leaving it stuck until Mute.
    stopAllVoicesImmediately();
  }

  function selectInput(input) {
    detachInput();
    selectedInput = input;
    input.onmidimessage = onMIDIMessage;
    setStatus(input.name || 'MIDI device', true);
    pickerEl.classList.remove('visible');
  }

  function refreshDevices() {
    if (!midiAccess) return;
    var inputs = Array.from(midiAccess.inputs.values()).filter(function (input) {
      return input.state === 'connected';
    });

    if (inputs.length === 0) {
      detachInput();
      setStatus('No MIDI device', false);
      pickerEl.classList.remove('visible');
      return;
    }

    // Keep the current selection if it is still present.
    if (selectedInput && inputs.indexOf(selectedInput) !== -1) {
      setStatus(selectedInput.name || 'MIDI device', true);
      pickerEl.classList.remove('visible');
      return;
    }

    if (inputs.length === 1) {
      selectInput(inputs[0]);
      return;
    }

    detachInput();
    setStatus('Multiple devices — choose one', false);
    renderPicker(inputs);
  }

  function onMIDIMessage(event) {
    lastMIDIMessageAt = Date.now();

    var data = event.data;
    var command = data[0] >> 4;
    var channel = (data[0] & 0x0f) + 1;
    var tsMs = recording ? (performance.now() - recordStartPerf) : 0;

    if (command === 0x9 || command === 0x8) {
      var note = data[1];
      var velocity = data[2] || 0;
      var isOn = command === 0x9 && velocity > 0;
      addFeedEntry({
        type: isOn ? 'note-on' : 'note-off',
        channel: channel,
        text: noteName(note),
        detail: 'vel ' + velocity
      });
      if (recording) {
        recordedEvents.push({ tsMs: tsMs, channel: channel, command: isOn ? 0x9 : 0x8, data1: note, data2: velocity });
        if (isOn) {
          noteOnCount++;
          updateReadout();
        }
      }
      if (isOn) {
        synthNoteOn(channel, note, velocity);
      } else {
        synthNoteOff(channel, note);
      }
    } else if (command === 0xb) {
      var controller = data[1];
      var value = data[2];
      addFeedEntry({
        type: 'cc',
        channel: channel,
        text: 'CC ' + controller,
        detail: String(value)
      });
      if (recording) {
        recordedEvents.push({ tsMs: tsMs, channel: channel, command: 0xb, data1: controller, data2: value });
      }
    }
  }

  function addFeedEntry(entry) {
    feedEntries.unshift(entry);
    if (feedEntries.length > FEED_LIMIT) {
      feedEntries.length = FEED_LIMIT;
    }
    renderFeed();
  }

  function renderFeed() {
    if (feedEntries.length === 0) {
      feedEl.innerHTML = '<div class="feed-empty">Waiting for notes&hellip;</div>';
      return;
    }
    feedEl.innerHTML = feedEntries.map(function (e) {
      return '<div class="feed-row ' + e.type + '">' +
        '<span class="ch">' + (e.type === 'marker' ? 'MARK' : 'CH' + e.channel) + '</span>' +
        '<span class="note">' + e.text + '</span>' +
        '<span class="vel">' + e.detail + '</span>' +
        '</div>';
    }).join('');
  }

  function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      setStatus('Web MIDI not supported in this browser', false);
      return;
    }
    setStatus('Requesting MIDI access…', false);
    navigator.requestMIDIAccess({ sysex: false }).then(function (access) {
      midiAccess = access;
      midiAccess.onstatechange = refreshDevices;
      refreshDevices();
    }).catch(function () {
      setStatus('MIDI access denied — tap to retry', false);
    });
  }

  statusEl.addEventListener('click', function () {
    if (!midiAccess) {
      initMIDI();
    } else {
      refreshDevices();
    }
  });

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatElapsed(ms) {
    var totalSeconds = Math.floor(ms / 1000);
    var mm = Math.floor(totalSeconds / 60);
    var ss = totalSeconds % 60;
    return pad2(mm) + ':' + pad2(ss);
  }

  function updateReadout() {
    var elapsed = recording ? (performance.now() - recordStartPerf) : 0;
    recReadout.innerHTML = '<span class="time">' + formatElapsed(elapsed) + '</span> &middot; ' +
      noteOnCount + ' note' + (noteOnCount === 1 ? '' : 's');
  }

  function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
      });
    }).catch(function () {
      wakeLock = null;
    });
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (recording && document.visibilityState === 'visible' && !wakeLock) {
      acquireWakeLock();
    }
  });

  function defaultFilenamePrefix(date) {
    var y = date.getFullYear();
    var mo = pad2(date.getMonth() + 1);
    var d = pad2(date.getDate());
    var h = pad2(date.getHours());
    var mi = pad2(date.getMinutes());
    return y + '-' + mo + '-' + d + '_' + h + mi;
  }

  function showExportStatus(text, isError) {
    exportStatusEl.textContent = text;
    exportStatusEl.classList.toggle('error', !!isError);
  }

  function summarizeEvents(evts) {
    var summary = { total: evts.length, noteOn: 0, noteOff: 0, cc: 0 };
    evts.forEach(function (e) {
      if (e.command === 0x9) summary.noteOn++;
      else if (e.command === 0x8) summary.noteOff++;
      else if (e.command === 0xb) summary.cc++;
    });
    return summary;
  }

  function showExportPanel() {
    filenameInput.value = defaultFilenamePrefix(recordStartDate || new Date());
    showExportStatus('');

    var summary = summarizeEvents(recordedEvents);
    bufferInfoEl.textContent = summary.total + ' events buffered — ' +
      summary.noteOn + ' note-on, ' + summary.noteOff + ' note-off, ' + summary.cc + ' CC, ' +
      recordedMarkers.length + ' marker' + (recordedMarkers.length === 1 ? '' : 's');
    console.log('Pentawald: ' + summary.total + ' events captured this take', recordedEvents);
    console.log('Pentawald: ' + recordedMarkers.length + ' markers captured this take', recordedMarkers);

    exportPanel.hidden = false;
  }

  // Stamps immediately at call time; a free-text label can be attached to
  // the same marker object afterward without shifting when it landed.
  function addMarker(label) {
    if (!recording) return null;
    var tsMs = performance.now() - recordStartPerf;
    var marker = {
      type: 'marker',
      tsMs: tsMs,
      label: label,
      text: label,
      detail: formatElapsed(tsMs)
    };
    recordedMarkers.push(marker);
    addFeedEntry(marker);
    return marker;
  }

  function finalizePendingCustomMarker() {
    if (!pendingCustomMarker) return;
    var label = markerCustomInput.value.trim() || 'marker';
    pendingCustomMarker.label = label;
    pendingCustomMarker.text = label;
    pendingCustomMarker = null;
    markerCustomPanel.classList.remove('visible');
    markerCustomInput.value = '';
    renderFeed();
  }

  MARKER_PRESETS.forEach(function (label) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'marker-btn';
    btn.textContent = label;
    btn.addEventListener('click', function () {
      finalizePendingCustomMarker();
      addMarker(label);
    });
    markerRowEl.appendChild(btn);
  });

  var markerCustomBtn = document.createElement('button');
  markerCustomBtn.type = 'button';
  markerCustomBtn.className = 'marker-btn';
  markerCustomBtn.textContent = '+ marker';
  markerCustomBtn.addEventListener('click', function () {
    finalizePendingCustomMarker();
    var marker = addMarker('marker…');
    if (!marker) return;
    pendingCustomMarker = marker;
    markerCustomInput.value = '';
    markerCustomPanel.classList.add('visible');
    markerCustomInput.focus();
  });
  markerRowEl.appendChild(markerCustomBtn);

  markerCustomConfirm.addEventListener('click', finalizePendingCustomMarker);
  markerCustomInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') finalizePendingCustomMarker();
  });

  function startRecording() {
    recordedEvents = [];
    recordedMarkers = [];
    pendingCustomMarker = null;
    noteOnCount = 0;
    recordStartPerf = performance.now();
    recordStartDate = new Date();
    recording = true;
    exportPanel.hidden = true;
    recordBtn.textContent = '■ Stop';
    recordBtn.classList.add('recording');
    markerRowEl.classList.add('visible');
    markerCustomPanel.classList.remove('visible');
    updateReadout();
    acquireWakeLock();
    timerHandle = setInterval(updateReadout, 250);
  }

  function stopRecording() {
    recording = false;
    recordedDurationMs = performance.now() - recordStartPerf;
    finalizePendingCustomMarker();
    clearInterval(timerHandle);
    timerHandle = null;
    releaseWakeLock();
    recordBtn.textContent = '● Record';
    recordBtn.classList.remove('recording');
    markerRowEl.classList.remove('visible');
    markerCustomPanel.classList.remove('visible');
    updateReadout();
    showExportPanel();
  }

  recordBtn.addEventListener('click', function () {
    if (recording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  discardBtn.addEventListener('click', function () {
    recordedEvents = [];
    recordedMarkers = [];
    pendingCustomMarker = null;
    noteOnCount = 0;
    exportPanel.hidden = true;
    showExportStatus('');
    bufferInfoEl.textContent = '';
    updateReadout();
  });

  // --- Standard MIDI File (Type 1) writer ---

  function writeVarLen(value) {
    var bytes = [value & 0x7f];
    value = Math.floor(value / 128);
    while (value > 0) {
      bytes.unshift((value & 0x7f) | 0x80);
      value = Math.floor(value / 128);
    }
    return bytes;
  }

  function uint16BE(value) {
    return [(value >>> 8) & 0xff, value & 0xff];
  }

  function uint24BE(value) {
    return [(value >>> 16) & 0xff, (value >>> 8) & 0xff, value & 0xff];
  }

  function uint32BE(value) {
    return [(value >>> 24) & 0xff, (value >>> 16) & 0xff, (value >>> 8) & 0xff, value & 0xff];
  }

  function makeChunk(id, bytes) {
    var idBytes = [id.charCodeAt(0), id.charCodeAt(1), id.charCodeAt(2), id.charCodeAt(3)];
    return idBytes.concat(uint32BE(bytes.length), bytes);
  }

  function trackNameEvent(name) {
    var nameBytes = [];
    for (var i = 0; i < name.length; i++) nameBytes.push(name.charCodeAt(i) & 0xff);
    return writeVarLen(0).concat([0xff, 0x03], writeVarLen(nameBytes.length), nameBytes);
  }

  function msToTicks(ms) {
    return Math.round(ms * TICKS_PER_MS);
  }

  function buildTempoTrack(markers, durationMs) {
    var bytes = trackNameEvent('Tempo');
    var prevTick = 0;

    function emit(tick, metaBytes) {
      var delta = Math.max(0, tick - prevTick);
      prevTick = tick;
      bytes = bytes.concat(writeVarLen(delta), metaBytes);
    }

    emit(0, [0xff, 0x51, 0x03].concat(uint24BE(TEMPO_US_PER_QUARTER))); // 120 BPM
    emit(0, [0xff, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08]); // 4/4

    markers.slice().sort(function (a, b) { return a.tsMs - b.tsMs; }).forEach(function (m) {
      var textBytes = [];
      for (var i = 0; i < m.label.length; i++) textBytes.push(m.label.charCodeAt(i) & 0xff);
      emit(msToTicks(m.tsMs), [0xff, 0x06].concat(writeVarLen(textBytes.length), textBytes));
    });

    var trailing = Math.max(0, msToTicks(durationMs) - prevTick);
    bytes = bytes.concat(writeVarLen(trailing), [0xff, 0x2f, 0x00]);
    return makeChunk('MTrk', bytes);
  }

  function buildChannelTrack(channel, evts, durationMs) {
    evts.sort(function (a, b) { return a.tsMs - b.tsMs; });
    var bytes = trackNameEvent('Channel ' + channel);
    var prevTick = 0;
    var heldNotes = {};

    function emit(tick, statusByte, d1, d2) {
      var delta = Math.max(0, tick - prevTick);
      prevTick = tick;
      bytes = bytes.concat(writeVarLen(delta), [statusByte, d1, d2]);
    }

    evts.forEach(function (e) {
      var tick = msToTicks(e.tsMs);
      var statusByte = (e.command << 4) | (channel - 1);
      if (e.command === 0x9) {
        // The source can re-trigger a pitch without ever sending an
        // explicit off (e.g. continuous biofeedback re-firing). Close
        // the still-held note first so every note-on stays paired —
        // an unterminated note-on is exactly what gets silently
        // dropped by some DAWs' MIDI importers.
        if (heldNotes[e.data1]) {
          emit(tick, 0x80 | (channel - 1), e.data1, 0);
        }
        emit(tick, statusByte, e.data1, e.data2);
        heldNotes[e.data1] = true;
      } else if (e.command === 0x8) {
        // A note-off with nothing currently held (e.g. a note that was
        // already sounding when recording started) has no note-on to
        // pair with in this file — discard it rather than emit an
        // orphan event.
        if (heldNotes[e.data1]) {
          emit(tick, statusByte, e.data1, e.data2);
          delete heldNotes[e.data1];
        }
      } else {
        emit(tick, statusByte, e.data1, e.data2);
      }
    });

    // Close out anything still held when recording stopped.
    var endTick = Math.max(prevTick, msToTicks(durationMs));
    Object.keys(heldNotes).forEach(function (note) {
      emit(endTick, 0x80 | (channel - 1), Number(note), 0);
    });

    var trailing = Math.max(0, msToTicks(durationMs) - prevTick);
    bytes = bytes.concat(writeVarLen(trailing), [0xff, 0x2f, 0x00]);
    return makeChunk('MTrk', bytes);
  }

  function buildMidiFile(evts, markers, durationMs) {
    var channelMap = {};
    evts.forEach(function (e) {
      if (!channelMap[e.channel]) channelMap[e.channel] = [];
      channelMap[e.channel].push(e);
    });
    var channels = Object.keys(channelMap).map(Number).sort(function (a, b) { return a - b; });

    var tracks = [buildTempoTrack(markers, durationMs)];
    channels.forEach(function (ch) {
      tracks.push(buildChannelTrack(ch, channelMap[ch], durationMs));
    });

    var headerBytes = uint16BE(1).concat(uint16BE(tracks.length), uint16BE(PPQ));
    var allBytes = makeChunk('MThd', headerBytes);
    tracks.forEach(function (t) { allBytes = allBytes.concat(t); });
    return new Uint8Array(allBytes);
  }

  function sanitizeFilename(name) {
    name = name.trim().replace(/[\\/:*?"<>|]+/g, '-');
    if (!name) name = 'pentawald_' + Date.now();
    if (!/\.mid$/i.test(name)) name += '.mid';
    return name;
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    showExportStatus('Downloaded ' + filename + ' — attach it from Downloads in Signal (or your files app).');
  }

  function describeError(err) {
    if (!err) return 'unknown error';
    var name = err.name || 'Error';
    var message = err.message || String(err);
    return name + ': ' + message;
  }

  // Everything between the click and share() below is synchronous — no
  // canShare() precheck, no candidate cycling, nothing awaited. Building
  // the Blob/File is plain synchronous computation, not an async
  // operation, so it doesn't touch the tap's user-activation window;
  // share() is the very first (and only) thing that can consume it.
  exportBtn.addEventListener('click', function () {
    var bytes = buildMidiFile(recordedEvents, recordedMarkers, recordedDurationMs);
    var filename = sanitizeFilename(filenameInput.value);
    var blob = new Blob([bytes], { type: 'audio/midi' });

    showExportStatus('Exporting…');

    if (!navigator.share) {
      downloadBlob(blob, filename);
      return;
    }

    var file;
    try {
      file = new File([blob], filename, { type: 'audio/midi' });
    } catch (err) {
      console.warn('Pentawald share: File() threw, falling back to download', describeError(err));
      downloadBlob(blob, filename);
      return;
    }

    try {
      navigator.share({ files: [file], title: filename }).then(function () {
        showExportStatus('Shared ' + filename);
      }).catch(function (err) {
        if (err && err.name === 'AbortError') {
          showExportStatus('Share cancelled');
          return;
        }
        console.warn('Pentawald share: rejected, falling back to download', describeError(err));
        downloadBlob(blob, filename);
      });
    } catch (err) {
      console.warn('Pentawald share: threw, falling back to download', describeError(err));
      downloadBlob(blob, filename);
    }
  });

  // Physical USB disconnects don't reliably fire MIDIAccess.onstatechange
  // on every Android/Chrome + USB-OTG combination, so device state isn't
  // trusted alone: re-poll the input list periodically as a fallback.
  setInterval(function () {
    if (midiAccess) refreshDevices();
  }, 1500);

  // A stuck note has no dependency on the browser noticing the device is
  // gone at all — if this device normally fires continuously and nothing
  // has arrived in a while, silence what's still sounding regardless of
  // what onstatechange/polling conclude about the connection itself.
  var SILENCE_TIMEOUT_MS = 2000;
  setInterval(function () {
    if (Object.keys(voices).length > 0 && lastMIDIMessageAt &&
        (Date.now() - lastMIDIMessageAt) > SILENCE_TIMEOUT_MS) {
      stopAllVoicesImmediately();
    }
  }, 500);

  initMIDI();
})();
</script>

</body>
</html>
